name: Java CI with DevSecOps Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        env:
          MY_APP_SECRET: ${{ secrets.APP_SECRET_KEY }}
        run: mvn test

  dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run OWASP Dependency-Check with API Key
        uses: dependency-check/DependencyCheck-action@main
        with:
          project: 'currency-converter'
          path: '.'
          format: 'HTML'
          out: 'reports'
          # 🌟 核心改動：
          # 1. 拿掉 --autoUpdate false (預設開啟自動更新，才能查到最新漏洞)
          # 2. 加上 --nvdApiKey 參數，並將環境變數中的 NVD_API_KEY 餵給它
          args: >
            --failOnCVSS 9
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-reports
          path: reports

  security-scan:
    name: ShiftLeft Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Perform slscan
        uses: ShiftLeftSecurity/scan-action@master
        with:
          type: "credscan,java"
          output: "reports"

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slscan-reports
          path: reports