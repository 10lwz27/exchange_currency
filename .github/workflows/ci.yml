name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        # 這裡加上 env，讓測試在 GitHub Actions 跑的時候能讀取到自訂的安全密鑰
        env:
          MY_APP_SECRET: ${{ secrets.APP_SECRET_KEY }} 
        run: mvn --batch-mode test

      - name: Build application
        run: mvn --batch-mode package -DskipTests

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY repository secret is required for OWASP Dependency-Check in CI."
            echo "Create it in GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Run dependency check
        run: >
          mvn --batch-mode
          org.owasp:dependency-check-maven:12.2.2:check
          -Dformats=HTML,JSON
          -DfailBuildOnCVSS=9
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  slscan:
    name: ShiftLeft Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Perform slscan
        uses: ShiftLeftSecurity/scan-action@v1.3.0
        with:
          type: "credscan,java,depscan"
        env:
          WORKSPACE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_AUTO_BUILD: true

      - name: Upload slscan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slscan-reports
          path: reports
