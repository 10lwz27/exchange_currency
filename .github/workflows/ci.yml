name: Java CI with DevSecOps Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        env:
          MY_APP_SECRET: ${{ secrets.APP_SECRET_KEY }}
        run: mvn test

  dependency-check:
    name: OWASP Dependency-Check Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download and Install OWASP Dependency-Check CLI
        run: |
          VERSION="10.0.4"
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip
          unzip dependency-check-${VERSION}-release.zip
          chmod +x dependency-check/bin/dependency-check.sh

      - name: Run Scan with Official CLI
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
          OSSINDEX_WARN_ONLY: 'true'
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "currency-converter" \
            --scan "." \
            --format "HTML" \
            --out "reports" \
            --failOnCVSS 9 \
            --nvdApiKey "$NVD_KEY"

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-reports
          path: reports

  security-scan:
    name: ShiftLeft Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Perform slscan
        uses: ShiftLeftSecurity/scan-action@master
        with:
          type: "credscan,java"
          output: "reports"

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slscan-reports
          path: reports